<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Studio Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: practice console for agent builders, calm, exact, dark Redwood-like
   IDEA: a working replica of the AI Agent Studio navigation you can break safely
   PICTURE: the studio itself: lists, editors, run trace, monitoring tables
   COLOUR and TYPE: black rail, deep teal canvas, gold active tab, green status; Inter + Caslon hero
   LAYOUT: fixed left rail, one page at a time, tabs per page; rail becomes a top strip on phones */
:root{color-scheme:dark;--rail:#000;--bg:#0a3442;--bg2:#072a35;--card:#0e4658;--card2:#0b3c4c;--line:#1f5c70;--ink:#f3f1ec;--mute:#a8c2cb;
--gold:#f0b93a;--ok:#7cbd5a;--okbg:#2f5a1f;--seed:#78bfd6;--warn:#f0b04a;--bad:#ff8a7a;--acc:#78bfd6;--btn:#134e61;--pri:#f3efe7;--prink:#0a3442}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.shell.col{grid-template-columns:64px minmax(0,1fr)}
aside{background:var(--rail);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 0}
.rtop{display:flex;justify-content:space-between;align-items:center;padding:0 14px 14px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700}
.col .logo span,.col aside a span,.col .sim{display:none}
aside a{display:flex;gap:14px;align-items:center;color:var(--ink);text-decoration:none;padding:13px 18px;font-weight:600;border-left:3px solid transparent;font-size:15.5px}
aside a:hover{background:#0b2730}aside a.on{background:#0a3442;border-left-color:var(--seed)}
aside svg{flex:none}
.sim{margin:14px 18px;font-size:12px;color:var(--mute);border:1px solid #333;border-radius:8px;padding:8px}
main{padding:26px clamp(14px,3vw,40px) 60px;max-width:1400px;width:100%}
.topbar{height:6px;background:linear-gradient(90deg,#c9a66b,#d5796a,#78bfd6,#e3c86b,#c97b5a);margin:-26px calc(-1*clamp(14px,3vw,40px)) 20px}
h1{font-size:clamp(24px,2.6vw,32px);line-height:1.1;margin:0 0 14px}
h2{font-size:19px;margin:0 0 10px}h3{font-size:15.5px;margin:0 0 4px}
.sub{color:var(--mute);margin:-6px 0 16px;max-width:80ch}
.ask{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;max-width:1220px}
.ask input{background:transparent;border:0;color:var(--ink);font-size:17px;padding:8px 0}
.ask input:focus-visible{outline:none}.ask:focus-within{outline:2px solid var(--seed)}
.ring{width:22px;height:13px;border:2.5px solid var(--seed);border-radius:99px;flex:none}
.hero{position:relative;border-radius:14px;overflow:hidden;padding:clamp(24px,5vw,60px);background:#062631;margin-bottom:18px;min-height:340px}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero>*:not(svg){position:relative}
.hero .hi{font-size:clamp(20px,2.4vw,30px);font-weight:300;margin:60px 0 4px}
.hero h1{font-family:"Libre Caslon Text",Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,64px);line-height:1.05;margin:0 0 20px;max-width:16ch}
.hero .ask{background:#04202acc;min-height:110px;align-items:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:99px;border:1px solid var(--line);background:#0d3e4ecc;color:var(--ink);padding:8px 16px;font-weight:500;min-height:40px;cursor:pointer;font:inherit}
.chip.w{background:#fff;color:#0a3442;border-color:#fff}
button,.btn{font:inherit;font-weight:600;min-height:42px;padding:9px 18px;border-radius:8px;border:1px solid transparent;background:var(--btn);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.pri{background:var(--pri);color:var(--prink)}
button.link{background:none;color:var(--seed);padding:4px 8px;min-height:34px}
button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button.icon{background:none;padding:6px;min-width:42px;justify-content:center}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:-4px 0 18px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border-radius:0;color:var(--ink);opacity:.85;border-bottom:3px solid transparent;flex:none;font-size:16px}
.tabs button.on{color:var(--gold);opacity:1;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.list>.li{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.8fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.li .k{font-size:13px;color:var(--mute)}.li .v{overflow-wrap:anywhere}
@media(max-width:900px){.list>.li{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.li>:first-child{grid-column:1/-1}}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap;background:#1d5568;color:var(--ink)}
.t-pub{background:var(--ok);color:#10240a}.t-seed{background:var(--seed);color:#062631}.t-draft{background:#5a5a52;color:#fff}.t-warn{background:var(--warn);color:#2b1a00}.t-bad{background:var(--bad);color:#2b0700}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
pre,code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px}
pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:420px;margin:0;white-space:pre-wrap}
.kpi{font-size:clamp(24px,2.6vw,32px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.kl{font-size:13px;color:var(--mute)}
.chat{display:flex;flex-direction:column;height:min(72vh,660px)}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:90%;padding:10px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--pri);color:var(--prink)}.m.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.m .meta{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.trace{max-height:min(72vh,660px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.step{border-left:3px solid var(--line);padding:4px 0 4px 10px}.step.llm{border-color:var(--seed)}.step.tool{border-color:var(--gold)}.step.err{border-color:var(--bad)}.step.meter{border-color:var(--ok)}.step.pol{border-color:#c58af0}
.step b{font-size:13px}.step pre{max-height:180px;margin-top:4px}
.bar{height:12px;background:var(--bg2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--seed)}
.brow{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.node{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);margin-bottom:8px}
.num{width:30px;height:30px;border-radius:50%;background:var(--seed);color:#062631;display:grid;place-items:center;font-weight:700}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card2)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.chk input,input[type=checkbox]{width:auto;min-height:0;accent-color:var(--gold)}
.note{font-size:13px;color:var(--mute)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.addc{display:flex;justify-content:space-between;gap:12px;cursor:pointer;min-height:150px;text-align:left;align-items:flex-start;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--ink);font:inherit}
.addc span.plus{font-size:32px;line-height:1;align-self:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border-radius:0;background:none;min-height:38px}.seg button.on{background:var(--btn);color:var(--gold)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--prink);padding:10px 16px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600}
.toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:min(640px,95vw);width:100%;padding:20px;max-height:90vh}
dialog::backdrop{background:#000a}
@media(max-width:820px){.shell,.shell.col{grid-template-columns:minmax(0,1fr)}aside{position:sticky;height:auto;overflow-x:auto;padding:0;z-index:30}#nav{display:flex}aside a{white-space:nowrap}.rtop,.sim{display:none}aside a{flex:none;padding:12px 14px;border-left:0;border-bottom:3px solid transparent}aside a.on{border-bottom-color:var(--seed)}.col aside a span{display:inline}
.topbar{margin-top:-26px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:12px}.stack td:empty{display:none}.brow{grid-template-columns:minmax(0,1fr) auto}.brow .bar{grid-column:1/-1;grid-row:2}.hero .hi{margin-top:10px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="shell" id="shell">
<aside>
  <div class="rtop"><div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#78bfd6"/><path d="M7 17l4-8 3 5 2-3 3 6" stroke="#062631" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Studio Sandbox</span></div><button class="icon" id="colb" aria-label="Collapse navigation">«</button></div>
  <nav id="nav"></nav>
  <div class="sim">Simulated environment. Synthetic data. Not Oracle software.<br><label for="rtmode" style="margin:8px 0 4px">Runtime</label><select id="rtmode"><option value="live">Live LLM (Claude)</option><option value="mock">Deterministic mock</option></select></div>
</aside>
<main><div class="topbar"></div><div id="view"></div></main>
</div>
<dialog id="dlg"><div id="dlgbody"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
/* Dummy Fusion-like database. All data is synthetic. Seeded so every load is identical. */
(function () {
  let s = 20261125;
  const rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const money = (a, b) => Math.round((a + rnd() * (b - a)) * 100) / 100;
  const day = (offset) => { const d = new Date(Date.UTC(2026, 10, 25)); d.setUTCDate(d.getUTCDate() + offset); return d.toISOString().slice(0, 10); };

  const organizations = [
    { OrganizationId: 300100, OrganizationCode: 'MEL1', OrganizationName: 'Melbourne Manufacturing', BusinessUnit: 'AU Operations', Type: 'Manufacturing', Currency: 'AUD' },
    { OrganizationId: 300101, OrganizationCode: 'SYD2', OrganizationName: 'Sydney Distribution Centre', BusinessUnit: 'AU Operations', Type: 'Distribution', Currency: 'AUD' },
    { OrganizationId: 300102, OrganizationCode: 'DXB3', OrganizationName: 'Dubai Service Depot', BusinessUnit: 'ME Operations', Type: 'Service', Currency: 'AED' }
  ];
  const uoms = ['Ea', 'Kg', 'Box', 'L'];
  const itemNames = ['Lead-acid battery 12V 70Ah', 'AGM battery 12V 100Ah', 'Battery terminal kit', 'Lithium module 48V', 'Separator sheet PE', 'Electrolyte solution', 'Plastic casing small', 'Plastic casing large', 'Copper busbar', 'Charger 10A', 'Charger 40A', 'Hydraulic pump seal', 'Conveyor belt 2m', 'Bearing 6205', 'Gearbox oil 20L', 'Pallet wrap film', 'Shipping carton A4', 'Label roll thermal', 'Sensor - temperature', 'Sensor - pressure', 'PLC controller', 'Torque wrench', 'Safety gloves', 'Air filter element', 'Fan motor 240V', 'Valve 2 inch', 'Steel bracket', 'Fastener pack M8', 'Lead ingot', 'Acid-proof hose'];
  const categories = ['Finished Goods', 'Finished Goods', 'Components', 'Finished Goods', 'Raw Material', 'Raw Material', 'Components', 'Components', 'Components', 'Finished Goods', 'Finished Goods', 'MRO Spares', 'MRO Spares', 'MRO Spares', 'MRO Spares', 'Packaging', 'Packaging', 'Packaging', 'Components', 'Components', 'Components', 'Tools', 'Consumables', 'MRO Spares', 'MRO Spares', 'MRO Spares', 'Components', 'Components', 'Raw Material', 'MRO Spares'];
  const items = itemNames.map((n, i) => ({
    ItemId: 100000 + i, ItemNumber: 'AS' + String(1001 + i), ItemDescription: n, ItemCategory: categories[i],
    PrimaryUOMCode: i === 4 || i === 28 ? 'Kg' : i === 5 || i === 14 ? 'L' : 'Ea', ItemStatus: i === 13 ? 'Obsolete' : i === 22 ? 'Pending' : 'Active',
    MakeOrBuy: categories[i] === 'Finished Goods' ? 'Make' : 'Buy', ListPrice: money(4, 900), LeadTimeDays: int(3, 45),
    MinQty: int(20, 120), MaxQty: int(300, 900), LotControlled: rnd() > 0.6 ? 'Y' : 'N', SerialControlled: i === 3 || i === 20 ? 'Y' : 'N'
  }));
  const subinvs = { MEL1: ['FG', 'RM', 'WIP', 'MRO'], SYD2: ['STORES', 'STAGING'], DXB3: ['SPARES', 'QUAR'] };
  const onhand = [];
  items.forEach(it => organizations.forEach(o => {
    if (o.Type === 'Service' && !['MRO Spares', 'Tools', 'Consumables'].includes(it.ItemCategory) && rnd() > 0.3) return;
    const q = rnd() < 0.15 ? 0 : int(0, it.MaxQty);
    onhand.push({ OrganizationCode: o.OrganizationCode, ItemNumber: it.ItemNumber, Subinventory: pick(subinvs[o.OrganizationCode]), OnhandQuantity: q, ReservedQuantity: Math.min(q, int(0, 60)), UOM: it.PrimaryUOMCode, MinQty: it.MinQty, BelowMin: q < it.MinQty ? 'Y' : 'N' });
  }));
  const supNames = ['Pacific Lead Metals', 'Southern Plastics Pty', 'Gulf Industrial Supplies', 'Apex Electronics', 'Murray Packaging', 'Kestrel Bearings', 'BlueLine Chemicals', 'Harbour Freight AU', 'Eastgate Tools', 'Coral Hydraulics'];
  const suppliers = supNames.map((n, i) => ({ SupplierId: 500 + i, SupplierNumber: 'SUP' + (2001 + i), Supplier: n, Country: i === 2 || i === 9 ? 'AE' : 'AU', Status: i === 7 ? 'Inactive' : 'Active', OnTimeDeliveryPct: int(71, 99), QualityRejectPct: Math.round(rnd() * 60) / 10, PaymentTerms: pick(['Net 30', 'Net 45', 'Net 60', '2/10 Net 30']), Rating: pick(['A', 'A', 'B', 'B', 'C']) }));
  const buyers = ['Priya Nair', 'Tom Walsh', 'Aisha Rahman', 'Liam Chen'];
  const purchaseOrders = [];
  for (let i = 0; i < 28; i++) {
    const sup = pick(suppliers), it = pick(items.filter(x => x.MakeOrBuy === 'Buy')), qty = int(10, 400), ordered = day(-int(2, 70));
    const promised = day(int(-20, 30)), status = pick(['Open', 'Open', 'Open', 'Closed', 'Approved', 'Pending Approval', 'Partially Received']);
    const rec = status === 'Closed' ? qty : status === 'Partially Received' ? Math.floor(qty / 2) : 0;
    purchaseOrders.push({ POHeaderId: 9000 + i, OrderNumber: 'PO' + (45000 + i), Supplier: sup.Supplier, SupplierNumber: sup.SupplierNumber, Buyer: pick(buyers), ShipToOrganization: pick(organizations).OrganizationCode, ItemNumber: it.ItemNumber, Quantity: qty, QuantityReceived: rec, UnitPrice: Math.round(it.ListPrice * 0.6 * 100) / 100, Amount: Math.round(qty * it.ListPrice * 0.6 * 100) / 100, Currency: 'AUD', OrderedDate: ordered, PromisedDate: promised, Status: status, Late: status !== 'Closed' && promised < day(0) ? 'Y' : 'N' });
  }
  const customers = ['Metro Auto Parts', 'Outback Fleet Services', 'Coastal Marine', 'GreenGrid Energy', 'Sunrise Mining', 'Al Noor Trading'];
  const salesOrders = [];
  for (let i = 0; i < 26; i++) {
    const it = pick(items.filter(x => x.ItemCategory === 'Finished Goods')), qty = int(5, 150);
    salesOrders.push({ HeaderId: 7000 + i, OrderNumber: 'SO' + (88000 + i), Customer: pick(customers), ItemNumber: it.ItemNumber, OrderedQuantity: qty, Amount: Math.round(qty * it.ListPrice * 100) / 100, Currency: 'AUD', RequestedShipDate: day(int(-5, 25)), FulfillOrganization: pick(['MEL1', 'SYD2']), Status: pick(['Booked', 'Awaiting Shipping', 'Shipped', 'Closed', 'On Hold']), HoldReason: '' });
  }
  salesOrders.forEach(so => { if (so.Status === 'On Hold') so.HoldReason = pick(['Credit check', 'Pricing review', 'Item shortage']); });
  const workOrders = [];
  for (let i = 0; i < 16; i++) {
    const it = pick(items.filter(x => x.MakeOrBuy === 'Make')), qty = int(50, 600), st = pick(['Released', 'Released', 'Unreleased', 'Completed', 'On Hold', 'Closed']);
    workOrders.push({ WorkOrderId: 6000 + i, WorkOrderNumber: 'WO' + (33000 + i), OrganizationCode: 'MEL1', ItemNumber: it.ItemNumber, PlannedQuantity: qty, CompletedQuantity: st === 'Completed' || st === 'Closed' ? qty : st === 'Released' ? int(0, qty) : 0, PlannedStartDate: day(int(-15, 10)), PlannedCompletionDate: day(int(0, 25)), Status: st, WorkCenter: pick(['Assembly', 'Formation', 'Charging', 'Packing']), ShortageFlag: rnd() > 0.7 ? 'Y' : 'N' });
  }
  const invoices = [];
  purchaseOrders.slice(0, 22).forEach((po, i) => {
    const variance = rnd() > 0.75 ? money(-180, 420) : 0;
    invoices.push({ InvoiceId: 40000 + i, InvoiceNumber: 'INV-' + (7100 + i), Supplier: po.Supplier, PONumber: po.OrderNumber, InvoiceAmount: Math.round((po.Amount + variance) * 100) / 100, POAmount: po.Amount, Variance: variance, InvoiceDate: day(-int(1, 40)), DueDate: day(int(-10, 40)), MatchStatus: variance !== 0 ? 'Price variance' : po.QuantityReceived === 0 ? 'Not received' : 'Matched', ValidationStatus: variance !== 0 || po.QuantityReceived === 0 ? 'Needs revalidation' : 'Validated', PaymentStatus: pick(['Unpaid', 'Unpaid', 'Paid', 'Partially paid']), HoldName: variance !== 0 ? 'Price hold' : po.QuantityReceived === 0 ? 'Quantity received hold' : '' });
  });
  const assets = [];
  ['Formation line 1', 'Formation line 2', 'Casting machine', 'Forklift 07', 'Forklift 12', 'Air compressor', 'Packing robot', 'Charging rack A', 'HVAC unit roof', 'Wastewater pump'].forEach((n, i) => assets.push({ AssetId: 800 + i, AssetNumber: 'AST-' + (110 + i), AssetDescription: n, OrganizationCode: i > 7 ? 'DXB3' : 'MEL1', Criticality: pick(['High', 'Medium', 'Low']), Status: i === 4 ? 'Out of service' : 'In service', MeterReading: int(1200, 48000), MeterUOM: 'Hours', LastPMDate: day(-int(5, 120)) }));
  const maintenanceWorkOrders = [];
  for (let i = 0; i < 14; i++) {
    const a = pick(assets);
    maintenanceWorkOrders.push({ WorkOrderNumber: 'MWO-' + (5100 + i), AssetNumber: a.AssetNumber, AssetDescription: a.AssetDescription, OrganizationCode: a.OrganizationCode, WorkOrderType: pick(['Preventive', 'Preventive', 'Corrective', 'Inspection']), Priority: pick(['1-Urgent', '2-High', '3-Normal']), Status: pick(['Released', 'Unreleased', 'Completed', 'Waiting for parts']), ScheduledStart: day(int(-10, 20)), EstimatedHours: int(1, 16), MaterialItem: pick(items.filter(x => x.ItemCategory === 'MRO Spares')).ItemNumber });
  }

  return keyCard + `<div class="hero"><svg class="art" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g1" cx=".75" cy=".3" r=".7"><stop offset="0" stop-color="#1d5a6c"/><stop offset="1" stop-color="#062631"/></radialGradient></defs><rect width="1200" height="420" fill="url(#g1)"/><path d="M820 -20C980 -40 1120 60 1110 220 1100 360 980 430 860 420 760 410 700 330 720 230 740 130 700 0 820 -20z" fill="#a9cfd6" opacity=".55"/><path d="M1000 210c80-30 190 10 210 120s-60 170-150 160-140-80-130-160 20-100 70-120z" fill="#e0a361" opacity=".85"/><path d="M1080 300c50-10 120 30 120 90s-80 60-120 40-50-120 0-130z" fill="#d97a6a" opacity=".7"/>${Array.from({ length: 26 }, (_, i) => `<ellipse cx="${700 + i * 17 + (i % 5) * 9}" cy="${40 + (i % 7) * 16 + Math.floor(i / 7) * 10}" rx="9" ry="2.6" transform="rotate(${18 + i % 4 * 6} ${700 + i * 17} ${40 + (i % 7) * 16})" fill="${i % 3 ? '#f3c49a' : '#e57b5e'}" opacity=".85"/>`).join('')}</svg>
   <p class="hi">Hi, sandbox builder!</p><h1>What would you like to build?</h1>
   <form id="buildf"><div class="ask"><span class="ring"></span><textarea id="buildin" style="background:transparent;border:0;min-height:70px;font-size:17px" placeholder="Describe an agent, e.g. a workflow that finds late POs for critical items and drafts expedite emails"></textarea><button class="pri" id="buildb">Build</button></div></form>
   <div class="chips">${['Inventory balance analyst', 'Spend anomaly radar', 'Supplier risk monitor', 'Maintenance backlog planner', 'Customer order status helper'].map(c => `<button class="chip" data-a="chip" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
  <div class="grid" style="margin-bottom:16px">${[['Workflows', s.workflows.length, 'Published: ' + s.workflows.filter(w => w.status === 'Published').length], ['Applications', s.applications.length, 'Deployed: ' + s.applications.filter(a => a.status === 'Deployed').length], ['Sessions recorded', fmt(sessions), 'Synthetic + test'], ['AI Units recorded', fmt(au), usd(au * s.rates.unitPrice)], ['Approvals pending', pending(), 'In Approvals']].map(([l, v, n]) => `<div class="card"><div class="kpi">${esc(v)}</div><div class="kl">${esc(l)} · ${esc(n)}</div></div>`).join('')}</div>
  <div class="card"><h2>What each area does</h2><p class="note">Sandbox interpretation of the AI Agent Studio navigation. Behaviour in your release can differ; check the Oracle documentation for your version.</p>
   <div class="scroll"><table class="stack"><thead><tr><th>Area</th><th>Purpose</th><th>Practice here</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><a href="#${r[2]}" style="color:var(--seed)">Open</a></td></tr>`).join('')}</tbody></table></div>
   <h3 style="margin-top:14px">Suggested practice path</h3><ol style="margin:4px 0 0;padding-left:20px;color:var(--mute)"><li>Run a seeded workflow (Workflows → ▷) and read the trace.</li><li>Deploy "Order Status Assistant". It fails on the BYO LLM credential and the untested carrier connector; fix both in Credentials and Connectors.</li><li>Ask a workflow to set a PO status. The policy turns it into an approval; approve it and check the PO in Sandbox Data.</li><li>Run an evaluation set, then compare AI Units in Monitoring and the Cost Estimator.</li></ol></div>`;
};

/* ---------- Applications ---------- */

  <div class="list">${apps.map(a => `<div class="li"><div><h3>${esc(a.name)}</h3>${stTag(a.status)}<div class="note" style="margin-top:4px">${esc(a.description)}</div></div><div><div class="k">Code</div><div class="v mono">${esc(codeOf(a.name))}</div></div><div><div class="k">Workflows</div><div class="v">${a.workflows.map(w => esc(byId('workflows', w)?.name)).join(', ')}</div></div><div><div class="k">Family</div><div class="v">${esc(a.family)} · ${esc(a.product)}</div></div><div><div class="k">Version</div><div class="v">${a.version || 0}</div></div><div class="row"><button class="icon" data-a="appOpen" data-id="${a.id}" title="Open">▷</button><button class="link" data-a="appEdit" data-id="${a.id}">Edit</button><button class="link" data-a="appDeploy" data-id="${a.id}">Deploy</button></div></div>`).join('') || '<p>No applications match.</p>'}</div>`;
};
V.app = () => {

  return `<div class="note"><a href="#applications" style="color:var(--seed)">Applications</a></div><div class="row"><h1 style="margin:0">${esc(a.name)}</h1>${stTag(a.status)}</div><p class="sub" style="margin-top:6px">${esc(a.description)}</p>
  <div class="grid" style="margin-bottom:14px">${ins}</div>
  <div class="card"><h2>Ask the application</h2><form id="appf" class="row" style="flex-wrap:nowrap"><input id="appin" value="${esc(a.prompt)}"><button class="pri">Run</button></form><pre id="appout" style="margin-top:12px">Results from ${esc(a.workflows.map(w => byId('workflows', w)?.name).join(', '))} appear here.</pre>
  <p class="note">${a.status === 'Deployed' ? 'Deployed: runs count as application sessions in Monitoring.' : 'Draft: runs count as test sessions. Deploy needs every workflow published.'}</p></div>`;
};

/* ---------- Workflows ---------- */
V.workflows = () => {
  const s = S(), sort = ui().wfSort || 'name'; let list = s.workflows.filter(w => match('wf', w.name, w.description, w.product));
  list = list.slice().sort((x, y) => sort === 'status' ? x.status.localeCompare(y.status) : sort === 'edited' ? String(y.editedOn || '').localeCompare(String(x.editedOn || '')) : x.name.localeCompare(y.name));
  return `<h1>Workflows</h1>${ask('Search workflows', 'wf')}<div class="row" style="margin-bottom:10px"><button data-a="wfNew">Add</button><button data-a="importCfg">Import</button><span class="sp"></span><label for="wfsort" style="margin:0">Sorted by</label><select id="wfsort" data-ui="wfSort" style="width:auto">${opts({ name: 'Name', status: 'Status', edited: 'Edited on' }, sort)}</select></div>
  <div class="list">${list.map(w => `<div class="li"><div><h3>${esc(w.name)}</h3>${w.seeded ? tag('Seeded', 't-seed') : tag('Custom')} ${tag(w.type === 'workflow' ? 'Sequential' : 'Supervisor')}<div class="note" style="margin-top:4px">${esc(w.description)}</div></div>
   <div><div class="k">Code</div><div class="v mono">${esc(codeOf(w.name, w.seeded))}</div></div><div><div class="k">LLM</div><div class="v">${esc(byId('llms', w.llmId)?.name || '—')}</div></div><div><div class="k">Edited on</div><div class="v">${esc(w.editedOn || '2026-11-20')}</div></div><div><div class="k">Status</div>${stTag(w.status)}<div class="note">v${w.version || 0}</div></div>
   <div class="row"><button class="icon" data-a="wfRun" data-id="${w.id}" title="Run">▷</button><button class="icon" data-a="wfEdit" data-id="${w.id}" title="View and edit">◉</button><button class="icon" data-a="wfCopy" data-id="${w.id}" title="Duplicate">⧉</button><button class="link" data-a="wfDeploy" data-id="${w.id}">${w.status === 'Published' ? 'Redeploy' : 'Deploy'}</button></div></div>`).join('') || '<p>No workflows match.</p>'}</div>`;
};
V.edit = () => {
  const w = byId('workflows', ui().edit); if (!w) return V.workflows(); const s = S();
  const node = (n, i) => `<div class="node"><div class="num">${i + 1}</div><div><div class="row"><select data-node="${i}" data-f="type" style="width:auto">${opts({ agent: 'Agent', condition: 'Condition', approval: 'Approval', docgen: 'Document template', email: 'Email' }, n.type)}</select><span class="sp"></span><button class="link" data-a="nodeUp" data-id="${i}">Move up</button><button class="link" data-a="nodeDel" data-id="${i}">Remove</button></div>
   ${n.type === 'agent' ? `<label>Agent</label><select data-node="${i}" data-f="agentId">${opts(s.agents, n.agentId)}</select><label>Step instruction</label><textarea data-node="${i}" data-f="prompt">${esc(n.prompt)}</textarea>` : ''}
   ${n.type === 'condition' ? `<label>Expression on previous output (contains:word or not:word)</label><input data-node="${i}" data-f="expr" value="${esc(n.expr)}">` : ''}
   ${n.type === 'approval' ? `<label>Approval process</label><select data-node="${i}" data-f="processId">${opts(s.approvalProcesses, n.processId)}</select>` : ''}
   ${n.type === 'docgen' ? `<label>Document template</label><select data-node="${i}" data-f="templateId">${opts(s.docTemplates, n.templateId)}</select>` : ''}
   ${n.type === 'email' ? `<label>To</label><input data-node="${i}" data-f="to" value="${esc(n.to)}">` : ''}</div></div>`;
  return `<div class="note"><a href="#workflows" style="color:var(--seed)">Workflows</a></div><div class="row" style="margin-bottom:12px"><h1 style="margin:0">${esc(w.name)}</h1>${stTag(w.status)}<span class="sp"></span><button data-a="wfRun" data-id="${w.id}">Run</button><button class="pri" data-a="wfDeploy" data-id="${w.id}">Deploy</button></div>
  ${w.seeded ? '<p class="note">Seeded workflow. Edits are allowed in the sandbox; in a real pod you would duplicate it first.</p>' : ''}
  <div class="two"><div class="card"><h2>Details</h2><label for="e_n">Name</label><input id="e_n" data-wf="name" value="${esc(w.name)}"><label for="e_d">Description</label><textarea id="e_d" data-wf="description">${esc(w.description)}</textarea>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))"><div><label>Type</label><select data-wf="type">${opts({ supervisor: 'Supervisor', workflow: 'Sequential workflow' }, w.type)}</select></div><div><label>LLM</label><select data-wf="llmId">${opts(s.creds.llms, w.llmId)}</select></div><div><label>Family</label><select data-wf="family">${opts(Object.keys(FAMILIES), w.family)}</select></div><div><label>Product</label><select data-wf="product">${opts(FAMILIES[w.family] || [], w.product)}</select></div><div><label>Agent origin</label><select data-wf="agentType">${opts(AGENT_TYPES, w.agentType)}</select></div><div><label>Minutes saved per session</label><input type="number" min="0" data-wf="minutesSaved" value="${esc(w.minutesSaved || 0)}"></div></div>
   <label>Starter questions (one per line)</label><textarea data-wf="starters">${esc((w.starters || []).join('\n'))}</textarea>
   <label>Agents</label><div class="chk">${s.agents.map(a => `<label><input type="checkbox" data-wfa="${a.id}" ${w.agents.includes(a.id) ? 'checked' : ''}>${esc(a.name)}</label>`).join('')}</div>
   <h3 style="margin-top:14px">Pre-deployment checks</h3>${C.validate(w).map(c => `<div class="${c.ok ? 'ok' : c.sev === 'warning' ? '' : 'bad'}">${c.ok ? '✓' : c.sev === 'warning' ? '!' : '✕'} ${esc(c.t)}</div>`).join('')}</div>
  <div class="card">${w.type === 'workflow' ? `<h2>Nodes</h2><p class="note">Run top to bottom. Each agent node is one LLM action; document templates meter at the document rate.</p>${(w.nodes || []).map(node).join('') || '<p class="note">No nodes.</p>'}<button data-a="nodeAdd">Add node</button>`
   : `<h2>Supervisor canvas</h2><p class="note">The supervisor routes each request to one agent. Topics apply to every agent that carries them.</p>${w.agents.map(id => byId('agents', id)).filter(Boolean).map(a => `<div class="box"><div class="row"><h3>${esc(a.name)}</h3><span class="sp"></span><button class="link" data-a="agentEdit" data-id="${a.id}">Edit agent</button></div><p class="note" style="margin:2px 0 8px">${esc(a.instructions)}</p><div class="row">${a.tools.map(x => tag(byId('tools', x)?.name || x, 't-seed')).join('')}${a.topics.map(x => tag(byId('topics', x)?.name || x)).join('')}</div></div>`).join('') || '<p class="note">Add at least one agent.</p>'}`}
   <details style="margin-top:12px"><summary>Assembled prompt</summary><pre>${esc(C.systemPrompt(w))}</pre></details></div></div>`;
};
V.run = () => {
  const s = S(); if (!byId('workflows', ui().play)) ui().play = s.workflows[0]?.id; const w = byId('workflows', ui().play); if (!w) return '<p>No workflows.</p>';
  const msgs = s.chats[w.id] || [];
  return `<div class="note"><a href="#workflows" style="color:var(--seed)">Workflows</a></div><h1>Run and debug</h1>
  <div class="row" style="margin-bottom:12px"><select id="pwf" style="width:auto;max-width:100%">${opts(s.workflows, w.id)}</select>${stTag(w.status)}${tag(byId('llms', w.llmId)?.name || '')}<select data-ui="mode" style="width:auto" aria-label="Runtime">${opts(modeOpts(), modeVal())}</select>${tag(rtLabel(), C.runtime() === 'mock' ? '' : 't-seed')}${ui().mode === 'api' ? '<button data-a="keySet">API key</button>' : ''}<button data-a="clearChat">Clear</button><button data-a="wfEdit" data-id="${w.id}">Edit</button></div>
  <div class="two"><div class="card chat"><div class="msgs" id="msgs">${msgs.length ? msgs.map(m => `<div class="m ${m.role === 'user' ? 'u' : 'a'}">${esc(m.text)}${m.meta ? `<span class="meta">${esc(m.meta)}</span>` : ''}</div>`).join('') : `<div class="note">${esc(s.creds.chat.greeting)}</div>${(w.starters || []).map(q => `<button style="text-align:left" data-a="starter" data-id="${esc(q)}">${esc(q)}</button>`).join('')}`}</div>
   <form id="chatf" class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="chatin" placeholder="Message ${esc(w.name)}" autocomplete="off"><button class="pri" id="sendb">Send</button></form></div>
  <div class="card"><h2>Trace</h2><div class="trace" id="trace"></div></div></div>`;
};
function renderTrace() { const el = $('#trace'); if (!el) return; const tr = S().trace || []; el.innerHTML = tr.length ? tr.map(x => `<div class="step ${x.k}"><b>${esc(x.t)}</b>${x.d && Object.keys(x.d).length ? `<pre>${esc(JSON.stringify(x.d, null, 2))}</pre>` : ''}</div>`).join('') : '<p class="note">Send a message to see LLM requests, tool calls, policy effects and metering.</p>'; el.scrollTop = el.scrollHeight; }
C.setOnTrace(renderTrace);

/* ---------- Resources ---------- */
V.resources = () => {
  const s = S(), t = curTab('resTab', 'agents'); let body = '';
  const addBtn = (a, l = 'Add') => `<div class="row" style="margin-bottom:12px"><button data-a="${a}" data-id="">${l}</button></div>`;
  if (t === 'agents') body = addBtn('agentEdit') + `<div class="list">${s.agents.filter(a => match('res', a.name, a.role)).map(a => `<div class="li"><div><h3>${esc(a.name)}</h3><div class="note">${esc(a.role)}</div></div><div><div class="k">Tools</div><div class="v">${a.tools.map(x => esc(byId('tools', x)?.name)).join(', ')}</div></div><div><div class="k">Topics</div><div class="v">${a.topics.map(x => esc(byId('topics', x)?.name)).join(', ')}</div></div><div><div class="k">Used in</div><div class="v">${s.workflows.filter(w => w.agents.includes(a.id) || (w.nodes || []).some(n => n.agentId === a.id)).map(w => esc(w.name)).join(', ') || '—'}</div></div><div></div><div><button class="link" data-a="agentEdit" data-id="${a.id}">Edit</button></div></div>`).join('')}</div>`;
  if (t === 'supervisors') body = `<div class="list">${s.workflows.filter(w => w.type === 'supervisor' && match('res', w.name)).map(w => `<div class="li"><div><h3>${esc(w.name)}</h3>${stTag(w.status)}</div><div><div class="k">Routes to</div><div class="v">${w.agents.map(id => esc(byId('agents', id)?.name)).join(', ')}</div></div><div><div class="k">LLM</div><div class="v">${esc(byId('llms', w.llmId)?.name)}</div></div><div></div><div></div><div><button class="link" data-a="wfEdit" data-id="${w.id}">Open</button></div></div>`).join('')}</div>`;
  if (t === 'tools') body = addBtn('toolEdit') + `<div class="scroll"><table class="stack"><thead><tr><th>Tool</th><th>Type</th><th>Target</th><th>Description</th><th></th></tr></thead><tbody>${s.tools.filter(x => match('res', x.name, x.type)).map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(TOOL_TYPES[x.type])}</td><td class="mono">${esc(x.type === 'business_object' ? FDB.resources[x.resource]?.path + ' · ' + (x.ops || []).join('/') : x.connectorId ? 'Connector: ' + byId('connectors', x.connectorId)?.name : x.templateId ? 'Template: ' + byId('docTemplates', x.templateId)?.name : x.processId ? 'Process: ' + byId('approvalProcesses', x.processId)?.name : (x.docIds || []).join(', ') || '—')}</td><td>${esc(x.description)}</td><td><button class="link" data-a="toolEdit" data-id="${x.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
  if (t === 'topics') body = addBtn('topicEdit') + `<div class="grid">${s.topics.filter(x => match('res', x.name, x.instructions)).map(x => `<div class="card"><h3>${esc(x.name)}</h3><p class="note">${esc(x.instructions)}</p><button class="link" data-a="topicEdit" data-id="${x.id}">Edit</button></div>`).join('')}</div>`;
  if (t === 'bo') body = `<p class="note">Business objects are the REST resources tools can call. Browse and query them in Sandbox Data.</p><div class="scroll"><table class="stack"><thead><tr><th>Object</th><th>Area</th><th>Path</th><th>Key</th><th class="n">Rows</th><th>Attributes</th></tr></thead><tbody>${Object.entries(FDB.resources).filter(([k]) => match('res', k)).map(([k, m]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(m.area)}</td><td class="mono">${esc(m.path)}</td><td>${esc(m.key)}</td><td class="n">${FDB[k].length}</td><td class="note">${esc(Object.keys(FDB[k][0]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
  if (t === 'deeplinks') body = addBtn('dlAdd') + `<div class="scroll"><table class="stack"><thead><tr><th>Name</th><th>Page</th><th>Pattern</th></tr></thead><tbody>${s.deeplinks.map(d => `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.page)}</td><td class="mono">${esc(d.pattern)}</td></tr>`).join('')}</tbody></table></div>`;
  if (t === 'functions') body = `<p class="note">Functions are deterministic helpers agents call instead of letting the LLM do arithmetic or date maths.</p><div class="scroll"><table class="stack"><thead><tr><th>Function</th><th>Signature</th><th>Description</th></tr></thead><tbody>${s.functions.map(f => `<tr><td><b>${esc(f.name)}</b></td><td class="mono">${esc(f.signature)}</td><td>${esc(f.description)}</td></tr>`).join('')}</tbody></table></div>
   <div class="card" style="margin-top:12px"><h3>Try calculate()</h3><div class="row" style="flex-wrap:nowrap"><input id="fnin" value="(450-120)*0.6"><button data-a="fnTry">Run</button></div><pre id="fnout" style="margin-top:8px">Result</pre></div>`;
  if (t === 'schemas') body = addBtn('schemaAdd') + `<div class="grid">${s.schemas.map(sc => `<div class="card"><h3>${esc(sc.name)}</h3><div class="row">${sc.fields.map(f => tag(f.name + ' · ' + f.type)).join('')}</div></div>`).join('')}</div>

  return `<h1>Resources</h1>${tabs('resTab', [['agents', 'Agents'], ['supervisors', 'Supervisor Agents'], ['tools', 'Tools'], ['topics', 'Topics'], ['bo', 'Business Objects'], ['deeplinks', 'Deeplinks'], ['functions', 'Functions'], ['schemas', 'Document Schema']])}${ask('Search resources', 'res')}${body}`;
};

/* ---------- Connectors ---------- */
V.connectors = () => {

function drawSessions() {

  const vals = days.map(d => s.daily.filter(x => x.d === d && (src === 'all' || x.src === src)).reduce((a, x) => a + x.s, 0));

    + vals.map((v, i) => { const h = (H - 28) * v / mx; return `<rect x="${L + i * bw + 1}" y="${H - B - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="#78bfd6"><title>${days[i]}: ${v} sessions</title></rect>`; }).join('')

function estCalc() {
